name: release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  goreleaser:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creates the release on edgedelta/edx.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo push of the updated formula to edgedelta/homebrew-tap.
          # Must be a token with contents:write on the tap repo — the default
          # GITHUB_TOKEN cannot write to another repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # See docs/releases.md for the fork and token setup.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Preserve WinGet manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: dist/winget/**
          if-no-files-found: error

  # Publish ./skills to edgedelta/agent-skills, where `npx skills add` installs
  # from. Runs on the tag, after the release, so the public skills never
  # describe a flag the released edx does not have yet.
  mirror-skills:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout edx
        uses: actions/checkout@v4

      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          repository: edgedelta/agent-skills
          path: agent-skills
          # Private half of a read-write deploy key on edgedelta/agent-skills
          # (titled "edx release: mirror-skills"); the default GITHUB_TOKEN
          # cannot write to another repository.
          ssh-key: ${{ secrets.AGENT_SKILLS_DEPLOY_KEY }}

      - name: Mirror skills
        run: make mirror-skills SKILLS_MIRROR=agent-skills

      - name: Commit and push
        working-directory: agent-skills
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "agent-skills already matches ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skills from edx ${GITHUB_REF_NAME}" \
            -m "Generated from https://github.com/edgedelta/edx/tree/${GITHUB_REF_NAME}/skills"
          git push
