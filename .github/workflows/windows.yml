name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o edx.exe .
      - name: Smoke test
        shell: pwsh
        env:
          EDX_NO_UPDATE_CHECK: "1"
        run: |
          ./edx.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./edx.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./edx.exe config path
          exit $LASTEXITCODE
