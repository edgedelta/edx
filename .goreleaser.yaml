# GoReleaser config for edx — builds cross-platform binaries, publishes a
# GitHub Release, and auto-updates the Homebrew formula in edgedelta/homebrew-tap.
# Validate locally with: go run github.com/goreleaser/goreleaser/v2@latest check
version: 2

project_name: edx

before:
  hooks:
    - go mod tidy

builds:
  - id: edx
    main: .
    binary: edx
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/edgedelta/edx/internal/cli.Version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: edx
    # Produces the Datadog/Homebrew naming convention:
    #   edx_<version>_Darwin_arm64.tar.gz, edx_<version>_Linux_x86_64.tar.gz, ...
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# NOTE: `brews` (Formula) is deprecated in GoReleaser in favor of
# `homebrew_casks`, BUT Homebrew Casks are macOS-only — Linux has no cask
# support. Since edx must install on both Linux and macOS, a Formula is the
# correct (and only) cross-platform choice. `goreleaser check` flags the
# deprecation, but `goreleaser release` runs fine and emits a working formula.
# Revisit if/when Homebrew supports casks on Linux.
brews:
  - name: edx
    repository:
      owner: edgedelta
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/edgedelta/edx"
    description: "Edge Delta command-line interface"
    license: "Apache-2.0"
    commit_author:
      name: edgedelta-release-bot
      email: release-bot@edgedelta.com
    install: |
      bin.install "edx"
    # Runs after install, upgrade and reinstall. Installs/refreshes the agent
    # skills for the coding assistants present on this machine, so a fresh
    # `brew install edx` is agent-ready and a plain `brew upgrade edx` (which
    # bypasses `edx update`) never leaves stale skills behind. Best-effort:
    # Ruby's `system` does not raise on a non-zero exit, so a machine with no
    # assistant just prints edx's "could not detect" note and the install
    # still succeeds. `--yes` is required — post_install has no interactive
    # stdin, so the confirm prompt would otherwise silently decline.
    post_install: |
      system bin/"edx", "skills", "install", "--yes"
    test: |
      assert_match version.to_s, shell_output("#{bin}/edx version")
    # Shown after `brew install` and in `brew info`. Kept free of backslashes:
    # GoReleaser emits caveats in a Ruby heredoc that would mangle ASCII-art
    # backslashes — the full wordmark renders via `edx version` / `edx --help`.
    caveats: |
      ▲ EDGE DELTA · edx

      Get started:
        edx auth login      # sign in (opens your browser)
        edx --help          # explore commands

      Agent skills for detected coding assistants were installed automatically.
        edx skills list     # see them
        edx skills install  # re-run detection (e.g. after installing an assistant)

      Docs: https://github.com/edgedelta/edx

release:
  github:
    owner: edgedelta
    name: edx
